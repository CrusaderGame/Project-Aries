riegsvolk to określenie odnoszące się do osób o wątpliwej reputacji, rekrutowanych do służby wojskowej. Panowie sięgają po ich usługi tylko w ostateczności. W zamian za amnestię i spory worek złota są gotowi zrobić wszystko."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "AFE217E54D962E0B7DF151BC7160CACF", "Grimwald - Mroczny las rozciągający się na północy stanowi naturalną granicę władzy Ludzi Króla. Większość puszcz i obszarów leśnych jest mroczna, tajemnicza i niebezpieczna, lecz Grimwald jest wyjątkowy. Nieliczni są na tyle odważni lub głupi, by przekroczyć jego granice. Prawie nikt z nich nigdy nie wraca. Śmierć czeka tu na śmiałków wszędzie: zwisa z drzew, czai się pod powierzchnią ziemi lub wśród konarów."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "1EAAD3134B44CD919EB32EB0A95DA56B", "Siegfried, najstarszy syn jednego z władców King’s Men, jako młody mężczyzna wyrusza w podróż, by odnaleźć siebie. Wyprawa, będąca istotnym elementem kultury ludzi króla, uzyskuje akceptację jego ojca. Bohater znika na lata, przemierzając świat, walcząc z potworami i uczestnicząc w bitwach jako najemnik. Zyskuje sławę i rozpoznawalność, lecz mimo to podróż nie przynosi mu spodziewanych odpowiedzi. Siegfried wciąż poszukuje swojego przeznaczenia i miejsca w świecie.")),Appearance=(ColorAndOpacity=(SpecifiedColor=(R=1.000000,G=1.000000,B=1.000000,A=1.000000),ColorUseRule=UseColor_Specified),Font=(FontObject="/Script/Engine.Font'/Engine/EngineFonts/Roboto.Roboto'",FontMaterial=None,OutlineSettings=(OutlineSize=0,bSeparateFillAlpha=False,bApplyOutlineToDropShadows=False,OutlineMaterial=None,OutlineColor=(R=0.000000,G=0.000000,B=0.000000,A=1.000000)),TypefaceFontName="Normal",Size=20.000000,LetterSpacing=0,SkewAmount=0.000000),ShadowOffset=(X=0.000000,Y=0.000000),ShadowColorAndOpacity=(R=1.000000,G=1.000000,B=1.000000,A=1.000000),Justification=Left),TipWrapAt=1000.000000,bSetDisplayTipTextManually=False),LoadingWidget=(LoadingIconType=LIT_CircularThrobber,LoadingWidgetType=LWT_Horizont